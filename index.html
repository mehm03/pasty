<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>pasty</title>
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="pasty">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<style>
:root{
  --bg:#000;--card:#18181b;--card2:#232327;--sheet:#121214;
  --line:rgba(255,255,255,.07);--line2:rgba(255,255,255,.12);
  --text:#f5f5f7;--sub:#98989f;--dim:#5c5c63;
  --accent:#6fd6ff;--accent2:#45c1f2;--ink:#00141d;--danger:#ff6b63;
  --safe-t:env(safe-area-inset-top,0px);--safe-b:env(safe-area-inset-bottom,0px);
  --kb:0px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter","Helvetica Neue",sans-serif;-webkit-font-smoothing:antialiased;touch-action:manipulation}
body{min-height:100vh;overscroll-behavior-y:none;-webkit-user-select:none;user-select:none}
input,textarea,select{-webkit-user-select:text;user-select:text}
body::before{content:"";position:fixed;left:0;right:0;top:0;height:380px;pointer-events:none;z-index:0;
  background:radial-gradient(110% 90% at 50% -25%,rgba(140,150,170,.20),rgba(80,90,110,.06) 45%,transparent 72%)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,textarea,select{font:inherit;font-size:16px;color:var(--text)}
svg.i{width:20px;height:20px;flex:none}
.statusscrim{position:fixed;top:0;left:0;right:0;height:var(--safe-t);background:rgba(0,0,0,.78);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);z-index:40}

#view{position:relative;z-index:1;max-width:720px;margin:0 auto;padding:0 16px calc(130px + var(--safe-b))}
.fade{animation:fade .28s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* header */
.hero{display:flex;align-items:flex-end;justify-content:space-between;padding:calc(var(--safe-t) + 22px) 2px 14px}
.hero h1{margin:0;font-size:38px;font-weight:800;letter-spacing:-.035em;line-height:1}
.hero h1 b{color:var(--accent)}
.round{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--card);border:1px solid var(--line);color:var(--text)}
.round:active{background:var(--card2)}
.nav{position:sticky;top:0;z-index:20;margin:0 -16px;padding:calc(var(--safe-t) + 6px) 12px 8px;display:flex;align-items:center;justify-content:space-between;
  background:rgba(0,0,0,.72);-webkit-backdrop-filter:blur(22px) saturate(160%);backdrop-filter:blur(22px) saturate(160%)}
.back{display:flex;align-items:center;gap:2px;color:var(--accent);font-size:17px;height:38px;max-width:70%;padding-right:8px}
.back span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.back svg{width:24px;height:24px}
.big{font-size:32px;font-weight:800;letter-spacing:-.03em;margin:6px 2px 2px;line-height:1.1;word-break:break-word}
.crumb{color:var(--sub);font-size:13px;margin:4px 2px 0}
.headgap{height:12px}

/* search */
.search{position:relative;margin:2px 0 18px}
.search input{width:100%;height:44px;border-radius:13px;background:var(--card);border:1px solid var(--line);padding:0 40px;outline:none;transition:border-color .2s,box-shadow .2s;-webkit-appearance:none;appearance:none}
.search input::placeholder{color:var(--dim)}
.search input:focus{border-color:rgba(111,214,255,.55);box-shadow:0 0 0 4px rgba(111,214,255,.12)}
.search .mag{position:absolute;left:12px;top:12px;color:var(--sub);pointer-events:none}
.search .clear{position:absolute;right:9px;top:10px;width:24px;height:24px;border-radius:50%;background:var(--card2);display:none;place-items:center;color:var(--sub)}
.search .clear svg{width:14px;height:14px}
.search.has .clear{display:grid}

/* sections */
.sec{display:flex;align-items:center;justify-content:space-between;font-size:13px;font-weight:600;color:var(--sub);text-transform:uppercase;letter-spacing:.07em;margin:24px 4px 10px}
.sec button{color:var(--accent);text-transform:none;letter-spacing:0;font-size:15px;font-weight:600}

/* quick cards */
.quick{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.qcard{position:relative;padding:14px;border-radius:18px;background:linear-gradient(180deg,#1d1d21,#141417);border:1px solid var(--line);overflow:hidden}
.qcard:active{transform:scale(.98)}
.qcard .qi{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:rgba(111,214,255,.12);color:var(--accent)}
.qcard .qn{position:absolute;right:14px;top:12px;font-size:26px;font-weight:700;letter-spacing:-.02em}
.qcard .ql{margin-top:14px;font-weight:600;font-size:15px}

/* folder grid */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(min-width:560px){.grid{grid-template-columns:repeat(3,1fr)}}
.fcard{padding:14px;border-radius:18px;background:var(--card);border:1px solid var(--line);min-width:0;transition:transform .15s}
.fcard:active{transform:scale(.97);background:var(--card2)}
.fico svg{width:38px;height:38px;color:var(--accent)}
.fico svg path{fill:rgba(111,214,255,.15)}
.fname{margin-top:8px;font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fmeta{margin-top:2px;font-size:12px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.newcard{border:1.5px dashed var(--line2);background:transparent;display:flex;align-items:center;gap:10px;color:var(--sub);font-weight:600;grid-column:1/-1}
.newcard svg{color:var(--accent)}

/* list */
.list{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.row{position:relative;display:flex;align-items:center;gap:12px;padding:10px 12px}
.row:not(:first-child)::before{content:"";position:absolute;left:76px;right:0;top:0;height:1px;background:var(--line)}
.row:active{background:var(--card2)}
.thumb{position:relative;width:52px;height:52px;flex:none;border-radius:12px;background:#0d0d0f;border:1px solid var(--line);display:grid;place-items:center;overflow:hidden;color:var(--sub)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb img.logo{width:26px;height:26px;object-fit:contain;border-radius:6px}
.thumb .ext{position:absolute;bottom:4px;font-size:9px;font-weight:700;letter-spacing:.04em;color:var(--accent)}
.badge{position:absolute;left:4px;bottom:4px;display:flex;align-items:center;gap:2px;padding:1px 5px 1px 3px;border-radius:6px;background:rgba(0,0,0,.65);font-size:10px;font-weight:600;color:#fff}
.badge svg{width:10px;height:10px}
.meta{flex:1;min-width:0}
.meta .t{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta .s{font-size:12.5px;color:var(--sub);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tags{display:flex;gap:4px;margin-top:6px;overflow:hidden}
.chip{flex:none;font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px;background:rgba(111,214,255,.10);color:var(--accent);border:1px solid rgba(111,214,255,.16);max-width:140px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip.more{background:var(--card2);color:var(--sub);border-color:var(--line)}
.when{align-self:flex-start;margin-top:4px;font-size:11.5px;color:var(--dim);white-space:nowrap}
mark{background:rgba(111,214,255,.24);color:#c9f1ff;border-radius:3px;padding:0 1px}

/* empty */
.empty{text-align:center;padding:38px 20px;color:var(--sub);border-radius:18px;border:1px solid var(--line);background:linear-gradient(180deg,rgba(255,255,255,.02),transparent)}
.empty .ei{width:52px;height:52px;margin:0 auto 12px;border-radius:16px;display:grid;place-items:center;background:rgba(111,214,255,.10);color:var(--accent)}
.empty .ei svg{width:26px;height:26px}
.empty h3{margin:0 0 4px;color:var(--text);font-size:17px}
.empty p{margin:0;font-size:14px;line-height:1.4}

/* dock */
.dock{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + var(--safe-b));z-index:30;display:flex;align-items:center;gap:6px;padding:6px;border-radius:999px;
  background:rgba(30,30,34,.74);-webkit-backdrop-filter:blur(26px) saturate(180%);backdrop-filter:blur(26px) saturate(180%);border:1px solid var(--line2);box-shadow:0 12px 40px rgba(0,0,0,.65)}
.dock button{height:50px;border-radius:999px;display:flex;align-items:center;justify-content:center;gap:7px;font-weight:600;font-size:15px;transition:transform .12s}
.dock button:active{transform:scale(.94)}
.dock .ghost{padding:0 18px;background:rgba(255,255,255,.07)}
.dock .ico{width:50px;background:rgba(255,255,255,.07)}
.dock .paste{padding:0 26px;font-weight:700;font-size:16px;color:var(--ink);background:linear-gradient(180deg,#a6e7ff,#4fc4f3);box-shadow:0 6px 24px rgba(79,196,243,.42),inset 0 1px 0 rgba(255,255,255,.7)}

/* sheets */
.sheet-wrap{position:fixed;inset:0;z-index:60}
.backdrop{position:absolute;inset:0;background:rgba(0,0,0,.6);opacity:0;transition:opacity .3s}
.sheet{position:absolute;left:0;right:0;bottom:var(--kb);max-width:720px;margin:0 auto;max-height:calc(100% - var(--kb) - var(--safe-t) - 18px);display:flex;flex-direction:column;
  background:var(--sheet);border:1px solid var(--line2);border-bottom:0;border-radius:24px 24px 0 0;transform:translateY(105%);transition:transform .36s cubic-bezier(.2,.9,.25,1),bottom .2s;box-shadow:0 -20px 60px rgba(0,0,0,.7)}
.open .backdrop{opacity:1}
.open .sheet{transform:none}
.grab{width:38px;height:5px;border-radius:3px;background:var(--line2);margin:8px auto 0;flex:none}
.sheet-head{display:flex;align-items:center;justify-content:space-between;padding:8px 16px 12px;flex:none}
.sheet-head .t{font-weight:700;font-size:16px}
.hlink{color:var(--accent);font-size:16px;min-width:64px;text-align:left;height:36px}
.hlink.strong{font-weight:700;text-align:right}
.hlink:disabled{opacity:.4}
.sheet-body{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 16px calc(28px + var(--safe-b));overscroll-behavior:contain}
.group{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.field{display:flex;align-items:center;gap:12px;padding:0 14px;min-height:50px;border-top:1px solid var(--line)}
.field:first-child{border-top:0}
.field>span{width:82px;flex:none;color:var(--sub);font-size:15px}
.field input,.field select{flex:1;min-width:0;background:none;border:0;outline:none;height:50px;-webkit-appearance:none;appearance:none}
.field select{color:var(--accent)}
.field input::placeholder,.field textarea::placeholder{color:var(--dim)}
.field.col{flex-direction:column;align-items:stretch;gap:4px;padding:12px 14px}
.field.col>span{width:auto}
.field textarea{background:none;border:0;outline:none;resize:none;min-height:66px;line-height:1.4;padding:0}
.static{flex:1;min-width:0;font-size:15px;padding:12px 0;word-break:break-all}
.static em{display:block;font-style:normal;color:var(--sub);font-size:12.5px;margin-top:2px}
.label{font-size:13px;font-weight:600;color:var(--sub);text-transform:uppercase;letter-spacing:.07em;margin:22px 4px 10px}
.fine{font-size:12.5px;color:var(--dim);margin:12px 4px 0;line-height:1.45}

/* preview + media */
.pv{border-radius:16px;overflow:hidden;background:var(--card);border:1px solid var(--line);margin-bottom:14px}
.pvimg{aspect-ratio:1.91/1;background:#0b0b0d;overflow:hidden}
.pvimg img{width:100%;height:100%;object-fit:cover;display:block}
.pvinfo{display:flex;align-items:center;gap:10px;padding:11px 12px}
.pvinfo .logo{width:22px;height:22px;border-radius:6px;flex:none;object-fit:contain;background:#0b0b0d}
.pvinfo .logo.ph{display:grid;place-items:center;color:var(--accent)}
.pvinfo .logo.ph svg{width:14px;height:14px}
.pvtext{min-width:0}
.pvtext .site{font-size:12px;color:var(--sub)}
.pvtext .pvt{font-size:14px;font-weight:600;margin-top:1px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.shimmer{background:linear-gradient(90deg,#17171a 0%,#26262b 50%,#17171a 100%);background-size:200% 100%;animation:sh 1.1s linear infinite}
.line{height:10px;border-radius:5px;margin:4px 0}
@keyframes sh{to{background-position:-200% 0}}
.mview{border-radius:16px;overflow:hidden;background:#050506;border:1px solid var(--line);margin-bottom:14px;display:grid;place-items:center}
.mview img,.mview video{display:block;max-width:100%;max-height:46vh;object-fit:contain}
.mview video{width:100%;background:#000}
.fview{border-radius:16px;border:1px solid var(--line);background:var(--card);margin-bottom:14px;padding:26px;display:grid;place-items:center}
.fbig{position:relative;color:var(--accent)}
.fbig svg{width:64px;height:64px;stroke-width:1.3}
.fbig b{position:absolute;left:0;right:0;bottom:12px;text-align:center;font-size:11px;letter-spacing:.05em}
.dup{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;margin-bottom:12px;border-radius:12px;background:rgba(255,200,90,.08);border:1px solid rgba(255,200,90,.2);font-size:13.5px;color:#ffd58a}
.dup button{color:var(--accent);font-weight:600;flex:none}

/* folder picker */
.tags-edit{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:10px}
.tag{display:flex;align-items:center;gap:6px;padding:6px 6px 6px 10px;border-radius:999px;background:rgba(111,214,255,.12);border:1px solid rgba(111,214,255,.2);color:var(--accent);font-size:13.5px;font-weight:600;max-width:100%}
.tag>svg{width:15px;height:15px}
.tag span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tag button{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;background:rgba(111,214,255,.18);flex:none}
.tag button svg{width:11px;height:11px}
.none{font-size:13.5px;color:var(--dim);padding:4px 2px}
.dropdown{width:100%;height:50px;border-radius:14px;background:var(--card);border:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 14px;color:var(--text)}
.dropdown svg{color:var(--sub);transition:transform .2s}
.dropdown.on{border-color:rgba(111,214,255,.45)}
.dropdown.on svg{transform:rotate(180deg)}
.menu{margin-top:8px;border-radius:14px;background:var(--card);border:1px solid var(--line);overflow:hidden;max-height:320px;overflow-y:auto}
.mi{width:100%;display:flex;align-items:center;gap:10px;padding:13px 14px;border-top:1px solid var(--line);text-align:left;font-size:15px}
.mi:first-child{border-top:0}
.mi:active{background:var(--card2)}
.mi>svg{color:var(--sub);width:18px;height:18px}
.mi span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mi .ck{color:var(--accent);width:18px;height:18px}
.mi.new{color:var(--accent);font-weight:600}
.mi.new>svg{color:var(--accent)}
.newrow{display:flex;flex-direction:column;gap:8px;padding:10px 12px 12px;border-top:1px solid var(--line);background:rgba(255,255,255,.02)}
.newrow input,.newrow select{height:42px;border-radius:10px;border:1px solid var(--line2);background:#0d0d0f;padding:0 12px;outline:none;-webkit-appearance:none;appearance:none}
.newrow select{color:var(--sub)}
.newrow input:focus{border-color:rgba(111,214,255,.55)}

/* buttons */
.actions{display:flex;gap:8px;margin-top:18px}
.btn{flex:1;height:46px;border-radius:13px;background:var(--card);border:1px solid var(--line);font-weight:600;font-size:15px;display:flex;align-items:center;justify-content:center;gap:7px;text-decoration:none;color:var(--text)}
.btn:active{background:var(--card2)}
.btn svg{width:18px;height:18px}
.btn.accent{color:var(--accent)}
.btn.danger{color:var(--danger)}
.btn.primary{background:linear-gradient(180deg,#a6e7ff,#4fc4f3);color:var(--ink);border:0;font-weight:700}
.btn.wide{width:100%;flex:none}
.btn.sm{height:42px}
.mt{margin-top:12px}
.bigfolder{display:grid;place-items:center;margin:4px 0 18px}
.bigfolder svg{width:72px;height:72px;color:var(--accent);stroke-width:1.2}
.bigfolder svg path{fill:rgba(111,214,255,.14)}
.confirm{padding:6px 16px calc(20px + var(--safe-b));text-align:center}
.confirm .ct{font-size:18px;font-weight:700;margin:8px 0 6px}
.confirm .cm{color:var(--sub);font-size:14.5px;line-height:1.45;margin-bottom:18px}
.confirm .btn{margin-top:8px}
.stat{display:flex;justify-content:space-between;flex:1;color:var(--text)}
.stat em{font-style:normal;color:var(--sub)}

/* toast */
#toast{position:fixed;left:50%;top:calc(var(--safe-t) + 12px);transform:translate(-50%,-30px);opacity:0;z-index:90;padding:10px 16px;border-radius:999px;background:rgba(40,40,45,.92);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);border:1px solid var(--line2);font-size:14px;font-weight:600;transition:all .3s cubic-bezier(.2,.9,.25,1);pointer-events:none;white-space:nowrap}
#toast.show{opacity:1;transform:translate(-50%,0)}
#toast b{color:var(--accent)}
</style>
</head>
<body>
<div class="statusscrim"></div>
<main id="view"></main>

<nav class="dock">
  <button class="ghost" data-act="upload" aria-label="Upload"><svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V4m0 0L7.5 8.5M12 4l4.5 4.5"/><path d="M5 14v3.5A2.5 2.5 0 0 0 7.5 20h9a2.5 2.5 0 0 0 2.5-2.5V14"/></svg>Upload</button>
  <button class="paste" data-act="paste" aria-label="Paste"><svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="4.5" width="14" height="16.5" rx="3"/><rect x="8.5" y="2.5" width="7" height="4" rx="1.5"/></svg>Paste</button>
  <button class="ico" data-act="new-folder" aria-label="New folder"><svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7.5A2.5 2.5 0 0 1 5.5 5h3.6c.6 0 1.1.2 1.5.6l1.3 1.3c.4.4.9.6 1.5.6h5.1A2.5 2.5 0 0 1 21 10v6.5a2.5 2.5 0 0 1-2.5 2.5h-13A2.5 2.5 0 0 1 3 16.5z"/><path d="M12 10.5v5M9.5 13h5"/></svg></button>
</nav>

<div id="sheets"></div>
<div id="toast"></div>
<input type="file" id="file-input" multiple hidden>
<input type="file" id="import-input" accept=".json,application/json" hidden>

<script>
'use strict';
/* ============ helpers ============ */
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const P={
  clip:'<rect x="5" y="4.5" width="14" height="16.5" rx="3"/><rect x="8.5" y="2.5" width="7" height="4" rx="1.5"/>',
  folder:'<path d="M3 7.5A2.5 2.5 0 0 1 5.5 5h3.6c.6 0 1.1.2 1.5.6l1.3 1.3c.4.4.9.6 1.5.6h5.1A2.5 2.5 0 0 1 21 10v6.5a2.5 2.5 0 0 1-2.5 2.5h-13A2.5 2.5 0 0 1 3 16.5z"/>',
  folderPlus:'<path d="M3 7.5A2.5 2.5 0 0 1 5.5 5h3.6c.6 0 1.1.2 1.5.6l1.3 1.3c.4.4.9.6 1.5.6h5.1A2.5 2.5 0 0 1 21 10v6.5a2.5 2.5 0 0 1-2.5 2.5h-13A2.5 2.5 0 0 1 3 16.5z"/><path d="M12 10.5v5M9.5 13h5"/>',
  chevL:'<path d="M15 5l-7 7 7 7"/>',chevD:'<path d="M6 9l6 6 6-6"/>',
  more:'<circle cx="6" cy="12" r="1.5" fill="currentColor"/><circle cx="12" cy="12" r="1.5" fill="currentColor"/><circle cx="18" cy="12" r="1.5" fill="currentColor"/>',

const dbAll=s=>tx(s,'readonly',st=>st.getAll());

/* ============ state ============ */
const S={folders:new Map(),items:new Map(),index:new Map(),urls:new Map(),stack:[{v:'home',q:''}]};
const route=()=>S.stack[S.stack.length-1];
const byName=(a,b)=>a.name.localeCompare(b.name,undefined,{sensitivity:'base',numeric:true});
const newest=(a,b)=>b.createdAt-a.createdAt;
const childrenOf=pid=>[...S.folders.values()].filter(f=>(f.parentId||null)===(pid||null)).sort(byName);
function pathOf(id){const p=[];let f=S.folders.get(id),g=0;while(f&&g++<60){p.unshift(f.name);f=S.folders.get(f.parentId)}return p}
function descIds(id){const out=[id];for(let i=0;i<out.length;i++)for(const f of S.folders.values())if(f.parentId===out[i])out.push(f.id);return out}
function tree(){const out=[];const walk=(pid,d)=>{for(const f of childrenOf(pid)){out.push({f,d});walk(f.id,d+1)}};walk(null,0);return out}
const itemsIn=fid=>[...S.items.values()].filter(i=>i.folderIds.includes(fid));
const dTitle=i=>i.title||(i.preview&&i.preview.title)||(i.type==='link'?(host(i.url)||i.url):stripExt(i.fileName))||'Untitled';
function thumbURL(i){if(!i.thumb)return null;const c=S.urls.get(i.id);if(c&&c.b===i.thumb)return c.u;if(c)URL.revokeObjectURL(c.u);
  const u=URL.createObjectURL(i.thumb);S.urls.set(i.id,{b:i.thumb,u});return u}

/* ============ search ============ */
const TR={'ı':'i','İ':'i','I':'i','ş':'s','Ş':'s','ğ':'g','Ğ':'g','ç':'c','Ç':'c','ö':'o','Ö':'o','ü':'u','Ü':'u','ß':'s','æ':'a','ø':'o','œ':'o'};
function foldChar(c){if(c.length>1)return' ';const t=TR[c];if(t)return t;const n=c.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');return n.length===1?n:(n.length?n[0]:' ')}
function fold(s){let o='';for(const c of String(s||''))o+=foldChar(c);return o}
const WORD=/[\p{L}\p{N}]+/gu;
function field(s,w){const text=fold(s);return{text,words:text.match(WORD)||[],w}}
function buildIndex(i){const p=i.preview||{};
  const fn=i.folderIds.map(id=>(S.folders.get(id)||{}).name||'').join(' ');
  S.index.set(i.id,[field(i.title,3),field(i.url,2),field(i.fileName,2),field(i.description,1.7),field(p.title,1.8),
    field(p.site,1.2),field(p.description,.7),field(fn,.9),field(i.type==='image'?'image photo picture':i.type==='video'?'video clip':i.type==='file'?'file document '+extOf(i.fileName):'link',.4)].filter(f=>f.text.trim()))}
function reindexAll(){S.index.clear();for(const i of S.items.values())buildIndex(i)}
function dist(a,b,max){const la=a.length,lb=b.length;if(Math.abs(la-lb)>max)return max+1;
  let p2=null,p=[];for(let j=0;j<=lb;j++)p[j]=j;
  for(let i=1;i<=la;i++){const c=[i];let mn=i;
    for(let j=1;j<=lb;j++){const cost=a[i-1]===b[j-1]?0:1;let v=Math.min(p[j]+1,c[j-1]+1,p[j-1]+cost);
      if(p2&&i>1&&j>1&&a[i-1]===b[j-2]&&a[i-2]===b[j-1])v=Math.min(v,p2[j-2]+1);c[j]=v;if(v<mn)mn=v}
    if(mn>max)return max+1;p2=p;p=c}
  return p[lb]}
function termScore(t,f){let best=0;const tol=t.length>=8?2:t.length>=4?1:0;
  for(const w of f.words){
    if(w===t)return 1;
    if(w.startsWith(t)){if(best<.85)best=.85;continue}
    if(t.length>=3&&w.includes(t)){if(best<.6)best=.6;continue}
    if(tol&&best<.5){let d=dist(t,w,tol);if(d>tol&&w.length>t.length)d=dist(t,w.slice(0,t.length),tol);
      if(d<=tol){const s=.5-.12*(d-1);if(s>best)best=s}}}
  if(best<.55&&t.length>=2&&f.text.includes(t))best=.55;
  return best}
const termsOf=q=>fold(q).split(/\s+/).filter(Boolean).slice(0,10);
function search(q,pool){const terms=termsOf(q);if(!terms.length)return[];const fq=fold(q).trim();const out=[];const now=Date.now();
  for(const it of pool){const fs=S.index.get(it.id)||[];let total=0,ok=true;
    for(const t of terms){let best=0;for(const f of fs){const s=termScore(t,f);if(s&&s*f.w>best)best=s*f.w}if(!best){ok=false;break}total+=best}
    if(!ok)continue;
    if(terms.length>1)for(const f of fs)if(f.text.includes(fq)){total+=1.5*f.w;break}
    total+=Math.max(0,1-(now-it.createdAt)/31536e6)*.25;
    out.push({it,s:total})}
  return out.sort((a,b)=>b.s-a.s).map(r=>r.it)}
function searchFolders(q,scope){const terms=termsOf(q);if(!terms.length)return[];const out=[];
  for(const f of scope){const fl=field(f.name+' '+pathOf(f.id).join(' '),1);let tot=0,ok=true;
    for(const t of terms){const s=termScore(t,fl);if(!s){ok=false;break}tot+=s}if(ok)out.push({f,s:tot})}
  return out.sort((a,b)=>b.s-a.s).map(r=>r.f)}
function hl(s,terms){s=String(s||'');if(!s||!terms||!terms.length)return esc(s);
  const ch=[...s],f=ch.map(foldChar).join(''),mk=new Array(ch.length).fill(false);
  for(const t of terms){if(t.length<2)continue;let i=f.indexOf(t);while(i>-1){for(let k=i;k<i+t.length;k++)mk[k]=true;i=f.indexOf(t,i+t.length)}}
  let o='',on=false;ch.forEach((c,k)=>{if(mk[k]&&!on){o+='<mark>';on=true}else if(!mk[k]&&on){o+='</mark>';on=false}o+=esc(c)});if(on)o+='</mark>';return o}

  let at=-1;for(const t of terms){const i=f.indexOf(t);if(i>-1&&(at<0||i<at))at=i}
  if(at<28)return s;return '…'+ch.slice(at-20).join('')}

const typeIcon=t=>({link:P.link,image:P.image,video:P.video,file:P.file})[t]||P.file;

  if(tu)th=`<img src="${tu}" alt="">`;

  return `<div class="row" data-act="open-item" data-id="${i.id}"><div class="thumb">${th}${badge}</div>
    <div class="meta"><div class="t">${hl(dTitle(i),terms)}</div><div class="s">${hl(sub,terms)}${desc?' — '+hl(desc,terms):''}</div>${tags?`<div class="tags">${tags}</div>`:''}</div>

const listHTML=(items,terms)=>`<div class="list">${items.map(i=>rowHTML(i,terms)).join('')}</div>`;

  const meta=showPath&&f.parentId?pathOf(f.parentId).join(' / '):[subs?`${subs} folder${subs>1?'s':''}`:'',`${n} item${n!==1?'s':''}`].filter(Boolean).join(' · ');

function titleOf(r){if(!r)return'pasty';if(r.v==='home')return'pasty';if(r.v==='all')return'All Items';if(r.v==='unsorted')return'Unsorted';const f=S.folders.get(r.id);return f?f.name:'Folder'}

function render(){const r=route(),v=$('#view');let h='';
  if(r.v==='home'){h=`<div class="hero"><h1>pasty<b>.</b></h1><button class="round" data-act="settings" aria-label="Settings">${I(P.sliders)}</button></div>`}
  else{const prev=S.stack[S.stack.length-2];
    h=`<div class="nav"><button class="back" data-act="back">${I(P.chevL)}<span>${esc(titleOf(prev))}</span></button>${r.v==='folder'?`<button class="round" data-act="folder-menu" data-id="${r.id}" aria-label="Folder options">${I(P.more)}</button>`:''}</div>
      <div class="big">${esc(titleOf(r))}</div>${r.v==='folder'&&S.folders.get(r.id)&&S.folders.get(r.id).parentId?`<div class="crumb">${esc(pathOf(r.id).join(' / '))}</div>`:''}<div class="headgap"></div>`}

function poolFor(r){const all=[...S.items.values()];

  if(r.v==='unsorted')return all.filter(i=>!i.folderIds.length);return all}

    if(fr.length)h+=`<div class="sec">Folders</div>`+gridHTML(fr.slice(0,12),true);

      <div class="qcard" data-act="go" data-v="unsorted"><div class="qi">${I(P.tray)}</div><div class="qn">${uns}</div><div class="ql">Unsorted</div></div></div>`;
    h+=`<div class="sec">Folders${roots.length?'<button data-act="new-folder">New</button>':''}</div>`;
    h+=roots.length?gridHTML(roots):`<div class="grid"><div class="fcard newcard" data-act="new-folder">${I(P.folderPlus)}Create your first folder</div></div>`;
    h+=`<div class="sec">Recent</div>`;
    h+=all.length?listHTML(all.sort(newest).slice(0,25)):emptyHTML(P.clip,'Nothing saved yet','Copy a link anywhere, come back, and tap <b style="color:var(--accent)">Paste</b>.');

    h+=its.length?listHTML(its):emptyHTML(P.folder,'Empty folder','Tap Paste or Upload while you’re in here and it’ll land in this folder.');
    c.innerHTML=h;return}
  const its=poolFor(r).sort(newest);
  c.innerHTML=`<div class="sec">${its.length} item${its.length!==1?'s':''}</div>`+(its.length?listHTML(its):emptyHTML(r.v==='unsorted'?P.tray:P.grid,r.v==='unsorted'?'All sorted':'Nothing yet',r.v==='unsorted'?'Every item is in a folder.':'Tap Paste to save your first link.'))}

function openSheet(inner){const w=document.createElement('div');w.className='sheet-wrap';w._urls=[];
  w.innerHTML=`<div class="backdrop"></div><div class="sheet"><div class="grab"></div>${inner}</div>`;
  $('#sheets').appendChild(w);w.querySelector('.backdrop').addEventListener('click',()=>closeSheet(w));
  requestAnimationFrame(()=>requestAnimationFrame(()=>w.classList.add('open')));
  /* swipe down on the grabber/header to close */

  sh.addEventListener('touchstart',e=>{const b=w.querySelector('.sheet-body');if(e.target.closest('.sheet-head,.grab')||(b&&b.scrollTop<=0&&e.target.closest('.mview,.pv,.bigfolder'))){y0=e.touches[0].clientY;dy=0;sh.style.transition='none'}},{passive:true});
  sh.addEventListener('touchmove',e=>{if(y0==null)return;dy=Math.max(0,e.touches[0].clientY-y0);sh.style.transform=`translateY(${dy}px)`},{passive:true});
  sh.addEventListener('touchend',()=>{if(y0==null)return;sh.style.transition='';sh.style.transform='';y0=null;if(dy>110)closeSheet(w)});
  return w}
function closeSheet(w){if(!w||w._closing)return;w._closing=true;if(document.activeElement)document.activeElement.blur();w.classList.remove('open');
  if(w._onClose)w._onClose();setTimeout(()=>{w._urls.forEach(u=>URL.revokeObjectURL(u));w.remove()},380)}

function confirmSheet(title,msg,ok='Delete'){return new Promise(res=>{let done=false;
  const w=openSheet(`<div class="confirm"><div class="ct">${esc(title)}</div><div class="cm">${esc(msg)}</div><button class="btn danger wide" data-x="ok">${esc(ok)}</button><button class="btn wide" data-x="no">Cancel</button></div>`);
  w._onClose=()=>{if(!done){done=true;res(false)}};
  w.addEventListener('click',e=>{const x=e.target.closest('[data-x]');if(!x)return;if(x.dataset.x==='ok'&&!done){done=true;res(true)}closeSheet(w)})})}

async function createFolder(name,parentId){const f={id:uid(),name:name.trim(),parentId:parentId||null,createdAt:Date.now()};await dbPut('folders',f);S.folders.set(f.id,f);return f}
function parentOptions(sel,exclude){exclude=exclude||[];
  return `<option value="">Top level</option>`+tree().filter(({f})=>!exclude.includes(f.id)).map(({f})=>`<option value="${f.id}"${f.id===sel?' selected':''}>${esc(pathOf(f.id).join(' / '))}</option>`).join('')}
function openFolderSheet(folder,defParent){const isNew=!folder;
  const nSub=folder?descIds(folder.id).length-1:0;
  const w=openSheet(`<div class="sheet-head"><button class="hlink" data-x="cancel">Cancel</button><div class="t">${isNew?'New Folder':'Edit Folder'}</div><button class="hlink strong" data-x="ok">${isNew?'Create':'Save'}</button></div>
   <div class="sheet-body"><div class="bigfolder">${I(P.folder)}</div>
   <div class="group"><label class="field"><span>Name</span><input class="fs-name" placeholder="Folder name" autocapitalize="words" maxlength="80"></label>
   <label class="field"><span>Inside</span><select class="fs-parent">${parentOptions(isNew?(defParent||''):(folder.parentId||''),isNew?[]:descIds(folder.id))}</select></label></div>
   ${isNew?'':`<button class="btn danger wide mt" data-x="del">${I(P.trash)}Delete Folder</button><div class="fine">Deleting removes this folder${nSub?` and its ${nSub} subfolder${nSub>1?'s':''}`:''}. The items inside are kept — they just leave the folder.</div>`}</div>`);
  const nm=w.querySelector('.fs-name');nm.value=folder?folder.name:'';
  if(isNew)nm.focus({preventScroll:true});
  nm.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();w.querySelector('[data-x=ok]').click()}});
  w.addEventListener('click',async e=>{const x=e.target.closest('[data-x]');if(!x)return;const k=x.dataset.x;
    if(k==='cancel')closeSheet(w);
    else if(k==='ok'){const name=nm.value.trim();if(!name){nm.focus();toast('Give the folder a name');return}
      const parent=w.querySelector('.fs-parent').value||null;
      if(isNew){await createFolder(name,parent);toast(`Created <b>${esc(name)}</b>`)}
      else{folder.name=name;folder.parentId=parent;await dbPut('folders',folder);toast('Folder saved')}
      reindexAll();closeSheet(w);render()}
    else if(k==='del'){if(await confirmSheet(`Delete “${folder.name}”?`,`Items inside stay in pasty — they’re only removed from this folder${nSub?' and its subfolders':''}.`)){await deleteFolder(folder.id);closeSheet(w);toast('Folder deleted')}}})}
async function deleteFolder(id){const ids=new Set(descIds(id));
  for(const it of S.items.values())if(it.folderIds.some(f=>ids.has(f))){it.folderIds=it.folderIds.filter(f=>!ids.has(f));await dbPut('items',it)}
  for(const fid of ids){await dbDel('folders',fid);S.folders.delete(fid)}
  S.stack=S.stack.filter(r=>!(r.v==='folder'&&ids.has(r.id)));if(!S.stack.length)S.stack=[{v:'home',q:''}];
  reindexAll();render()}

/* ============ link previews ============ */
function normUrl(t){t=String(t||'').trim();const m=t.match(/https?:\/\/[^\s<>"'`]+/i);if(m)return m[0].replace(/[).,;!?\]]+$/,'');
  if(/^[\w-]+(\.[\w-]+)+(:\d+)?([\/?#]\S*)?$/i.test(t))return'https://'+t;return t}
const isUrl=u=>/^https?:\/\/[^\s\/]+\.[^\s]+/i.test(u);
async function withTimeout(p,ms){let t;return Promise.race([p,new Promise((_,rej)=>{t=setTimeout(()=>rej(new Error('timeout')),ms)})]).finally(()=>clearTimeout(t))}
async function fetchPreview(url){const site=host(url);const base={url,site,title:'',description:'',image:'',logo:`https://www.google.com/s2/favicons?domain=${encodeURIComponent(site)}&sz=128`};
  try{const r=await withTimeout(fetch('https://api.microlink.io/?url='+encodeURIComponent(url)),9000);const j=await r.json();
    if(j&&j.status==='success'&&j.data){const d=j.data;
      Object.assign(base,{title:(d.title||'').trim(),description:(d.description||'').trim(),image:(d.image&&d.image.url)||'',logo:(d.logo&&d.logo.url)||base.logo,site:d.publisher||site})}}catch(e){}
  if(base.image){const t=await grabImage(base.image);if(t)base.thumb=t}
  return base}
async function grabImage(src){try{const r=await withTimeout(fetch(src,{mode:'cors'}),7000);if(!r.ok)return null;const b=await r.blob();if(!/^image\//.test(b.type))return null;return await shrink(b,480)}catch(e){return null}}
function shrink(blob,max){return new Promise((res,rej)=>{const u=URL.createObjectURL(blob);const im=new Image();
  im.onload=()=>{try{const s=Math.min(1,max/Math.max(im.naturalWidth,im.naturalHeight));const c=document.createElement('canvas');
    c.width=Math.max(1,Math.round(im.naturalWidth*s));c.height=Math.max(1,Math.round(im.naturalHeight*s));c.getContext('2d').drawImage(im,0,0,c.width,c.height);
    URL.revokeObjectURL(u);c.toBlob(b=>b?res(b):rej(new Error('blob')),'image/jpeg',.82)}catch(e){URL.revokeObjectURL(u);rej(e)}};
  im.onerror=()=>{URL.revokeObjectURL(u);rej(new Error('img'))};im.src=u})}
function videoInfo(blob){return new Promise(res=>{const u=URL.createObjectURL(blob);const v=document.createElement('video');v.muted=true;v.playsInline=true;v.setAttribute('playsinline','');v.preload='auto';
  let done=false;const fin=thumb=>{if(done)return;done=true;const duration=isFinite(v.duration)?v.duration:0;URL.revokeObjectURL(u);v.removeAttribute('src');try{v.load()}catch(e){}res({thumb,duration})};
  setTimeout(()=>fin(null),6000);
  v.addEventListener('loadedmetadata',()=>{try{v.currentTime=Math.min(.5,(v.duration||1)/3)}catch(e){fin(null)}});
  v.addEventListener('seeked',()=>{try{const s=Math.min(1,480/Math.max(v.videoWidth,v.videoHeight));const c=document.createElement('canvas');
    c.width=Math.max(1,Math.round(v.videoWidth*s));c.height=Math.max(1,Math.round(v.videoHeight*s));c.getContext('2d').drawImage(v,0,0,c.width,c.height);c.toBlob(b=>fin(b),'image/jpeg',.8)}catch(e){fin(null)}});
  v.addEventListener('error',()=>fin(null));v.src=u;try{v.load()}catch(e){}})}

/* ============ saving ============ */
async function commit(d){const now=Date.now();
  let pv=d.preview||null;if(pv&&pv.loading)pv={url:pv.url,site:pv.site,title:'',description:'',image:'',logo:''};
  const it={id:d.id||uid(),type:d.type,url:d.type==='link'?normUrl(d.url):'',title:(d.title||'').trim(),description:(d.description||'').trim(),
    folderIds:[...new Set(d.folderIds||[])].filter(id=>S.folders.has(id)),preview:pv,fileName:d.fileName||'',mime:d.mime||'',size:d.size||0,duration:d.duration||0,
    thumb:d.thumb||null,createdAt:d.createdAt||now,updatedAt:now};
  if(d.blob&&!d.blobSaved){const buf=await d.blob.arrayBuffer();await dbPut('blobs',new Blob([buf],{type:d.mime||d.blob.type||'application/octet-stream'}),it.id);d.blobSaved=true}
  await dbPut('items',it);S.items.set(it.id,it);buildIndex(it);d.id=it.id;d.createdAt=it.createdAt;return it}

/* ============ item editor ============ */
function openEditor(d,opts){opts=opts||{};const isNew=!!opts.isNew,Q=opts.queue;d.folderIds=d.folderIds||[];
  const label={link:'Link',image:'Photo',video:'Video',file:'File'}[d.type];
  const head=isNew?(Q&&Q.total>1?`${Q.index+1} of ${Q.total}`:`New ${label}`):label;
  const info=[fmtSize(d.size),fmtDur(d.duration),d.mime].filter(Boolean).join(' · ');
  const rest=Q?Q.total-Q.index-1:0;
  const w=openSheet(`<div class="sheet-head"><button class="hlink" data-x="cancel">${isNew?'Cancel':'Close'}</button><div class="t">${head}</div><button class="hlink strong" data-x="save">Save</button></div>
   <div class="sheet-body">
    <div class="ed-media"></div><div class="dup" hidden></div>
    <div class="group">
     ${d.type==='link'?`<label class="field"><span>Link</span><input class="ed-url" type="url" inputmode="url" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="https://"></label>`
       :`<div class="field"><span>File</span><div class="static">${esc(d.fileName||'Untitled')}<em>${esc(info)}</em></div></div>`}
     <label class="field"><span>Title</span><input class="ed-title" autocapitalize="sentences" maxlength="200"></label>
     <label class="field col"><span>Description</span><textarea class="ed-desc" rows="3" placeholder="Notes, keywords — anything you’ll want to search for later"></textarea></label>
    </div>
    <div class="label">Folders</div>
    <div class="tags-edit"></div>
    <button class="dropdown" data-x="dd"><span>Add to folder</span>${I(P.chevD)}</button>
    <div class="menu" hidden></div>
    ${rest>0?`<button class="btn accent wide mt" data-x="saveall">Save all ${rest+1} into these folders</button>`:''}
    ${isNew?'':`<div class="actions">${d.type==='link'
        ?`<a class="btn accent" href="${esc(d.url)}" target="_blank" rel="noopener">${I(P.open)}Open</a><button class="btn" data-x="copy">${I(P.copy)}Copy</button><button class="btn" data-x="sharelink">${I(P.share)}Share</button>`
        :`<button class="btn accent" data-x="sharefile">${I(P.share)}Share / Save</button>`}</div>
      <button class="btn danger wide mt" data-x="delete">${I(P.trash)}Delete</button>
      <div class="fine">Added ${esc(fullDate(d.createdAt))}${d.updatedAt&&d.updatedAt-d.createdAt>60000?` · edited ${esc(fullDate(d.updatedAt))}`:''}</div>`}
   </div>`);
  const urlI=w.querySelector('.ed-url'),tI=w.querySelector('.ed-title'),dI=w.querySelector('.ed-desc'),media=w.querySelector('.ed-media'),menu=w.querySelector('.menu'),dd=w.querySelector('.dropdown');
  if(urlI)urlI.value=d.url||'';tI.value=d.title||'';dI.value=d.description||'';requestAnimationFrame(()=>autosize(dI));
  const sync=()=>{if(urlI)d.url=urlI.value;d.title=tI.value;d.description=dI.value};
  const setPH=()=>{tI.placeholder=(d.preview&&d.preview.title)||(d.fileName&&stripExt(d.fileName))||'Add a title'};
  let mediaURL=null,blob=d.blob||null;
  function paintMedia(){
    if(d.type==='link'){const p=d.preview;if(!p){media.innerHTML='';return}
      if(p.loading){media.innerHTML=`<div class="pv"><div class="pvimg shimmer"></div><div class="pvinfo"><div style="flex:1"><div class="line shimmer" style="width:35%"></div><div class="line shimmer" style="width:80%"></div></div></div></div>`;return}
      const src=d.thumb?sheetURL(w,d.thumb):p.image;
      media.innerHTML=`<div class="pv">${src?`<div class="pvimg"><img src="${esc(src)}" alt="" referrerpolicy="no-referrer" onerror="this.parentNode.remove()"></div>`:''}
        <div class="pvinfo">${p.logo?`<img class="logo" src="${esc(p.logo)}" alt="" referrerpolicy="no-referrer" onerror="this.remove()">`:`<span class="logo ph">${I(P.link)}</span>`}
        <div class="pvtext"><div class="site">${esc(p.site||host(d.url))}</div>${p.title?`<div class="pvt">${esc(p.title)}</div>`:''}</div></div></div>`;return}
    if(!mediaURL&&blob)mediaURL=sheetURL(w,blob);
    if(d.type==='image')media.innerHTML=mediaURL?`<div class="mview"><img src="${mediaURL}" alt=""></div>`:'';
    else if(d.type==='video')media.innerHTML=mediaURL?`<div class="mview"><video src="${mediaURL}" controls playsinline preload="metadata"${d.thumb?` poster="${sheetURL(w,d.thumb)}"`:''}></video></div>`:'';
    else media.innerHTML=`<div class="fview"><div class="fbig">${I(P.file)}<b>${esc((extOf(d.fileName)||'file').toUpperCase())}</b></div></div>`}
  if(!isNew&&d.type!=='link')dbGet('blobs',d.id).then(b=>{blob=b||null;paintMedia()});
  paintMedia();setPH();

  /* link preview + duplicate check */
  let tok=0;
  async function loadPreview(force){if(!urlI)return;const u=normUrl(urlI.value);checkDup(u);
    if(!isUrl(u)){if(d.preview&&!force){d.preview=null;d.thumb=null;paintMedia();setPH()}return}
    if(!force&&d.preview&&d.preview.url===u)return;
    const my=++tok;d.preview={url:u,site:host(u),loading:true};d.thumb=null;paintMedia();
    const p=await fetchPreview(u);if(my!==tok)return;const th=p.thumb||null;delete p.thumb;
    if(w._closing){const it=d.id&&S.items.get(d.id);if(it&&it.url===u){it.preview=p;if(!it.thumb)it.thumb=th;await dbPut('items',it);buildIndex(it);renderContent()}return}
    d.preview=p;d.thumb=th;paintMedia();setPH()}
  function checkDup(u){const box=w.querySelector('.dup');const ex=isUrl(u)&&[...S.items.values()].find(i=>i.type==='link'&&i.id!==d.id&&i.url===u);
    if(!ex){box.hidden=true;return}const fs=ex.folderIds.map(id=>S.folders.get(id)).filter(Boolean).map(f=>f.name);
    box.innerHTML=`<span>Already saved${fs.length?` in ${esc(fs.join(', '))}`:''}</span><button data-x="viewdup" data-id="${ex.id}">View</button>`;box.hidden=false}
  if(urlI){let deb;urlI.addEventListener('input',()=>{clearTimeout(deb);deb=setTimeout(()=>loadPreview(),700)});urlI.addEventListener('blur',()=>loadPreview());
    if(isNew&&isUrl(normUrl(d.url))){urlI.value=normUrl(d.url);loadPreview()}else if(!isNew)checkDup(d.url);
    if(isNew&&!d.url)urlI.focus({preventScroll:true})}
  dI.addEventListener('input',()=>autosize(dI));

  /* folders */
  function paintTags(){const box=w.querySelector('.tags-edit');const fs=d.folderIds.map(id=>S.folders.get(id)).filter(Boolean);
    box.innerHTML=fs.length?fs.map(f=>`<span class="tag" title="${esc(pathOf(f.id).join(' / '))}">${I(P.folder)}<span>${esc(f.name)}</span><button data-x="untag" data-id="${f.id}" aria-label="Remove">${I(P.x)}</button></span>`).join('')
      :`<span class="none">Not in a folder yet — it’ll show under Unsorted.</span>`}
  function paintMenu(){const def=route().v==='folder'?route().id:'';
    menu.innerHTML=`<button class="mi new" data-x="mnew">${I(P.folderPlus)}<span>New Folder</span></button>
      <div class="newrow" hidden><input class="nf-name" placeholder="Folder name" autocapitalize="words" maxlength="80"><select class="nf-parent">${parentOptions(def)}</select><button class="btn primary sm" data-x="mcreate">Create &amp; add</button></div>`+
      tree().map(({f,d:dep})=>`<button class="mi" data-x="mtoggle" data-id="${f.id}" style="padding-left:${14+dep*20}px">${I(P.folder)}<span>${esc(f.name)}</span>${d.folderIds.includes(f.id)?I(P.check,'ck'):''}</button>`).join('');
    const nn=menu.querySelector('.nf-name');nn.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();menu.querySelector('[data-x=mcreate]').click()}})}
  paintTags();

  async function save(all){sync();
    if(d.type==='link'){d.url=normUrl(d.url);if(!d.url){toast('Add a link first');urlI&&urlI.focus();return}}
    const btn=w.querySelector('[data-x=save]');btn.disabled=true;
    try{await commit(d);
      if(Q){const next=Q.drafts.slice(Q.index+1);
        if(all){for(const n of next){n.folderIds=[...d.folderIds];await commit(n)}closeSheet(w);renderContent();toast(`Saved <b>${next.length+1}</b> items`);return}
        next.forEach(n=>{if(!n.folderIds.length)n.folderIds=[...d.folderIds]});closeSheet(w);renderContent();
        if(next.length)setTimeout(()=>openEditor(Q.drafts[Q.index+1],{isNew:true,queue:{drafts:Q.drafts,index:Q.index+1,total:Q.total}}),330);else toast('Saved');return}
      closeSheet(w);renderContent();toast(isNew?'Saved':'Updated')}
    catch(e){btn.disabled=false;toast('Couldn’t save — storage may be full')}}

  w.addEventListener('click',async e=>{const x=e.target.closest('[data-x]');if(!x)return;const k=x.dataset.x;
    if(k==='cancel')closeSheet(w);
    else if(k==='save')save(false);
    else if(k==='saveall')save(true);
    else if(k==='dd'){if(menu.hidden){paintMenu();menu.hidden=false;dd.classList.add('on')}else{menu.hidden=true;dd.classList.remove('on')}}
    else if(k==='mnew'){const nr=menu.querySelector('.newrow');nr.hidden=!nr.hidden;if(!nr.hidden)nr.querySelector('input').focus()}
    else if(k==='mcreate'){const nm=menu.querySelector('.nf-name').value.trim();if(!nm){menu.querySelector('.nf-name').focus();return}
      const f=await createFolder(nm,menu.querySelector('.nf-parent').value||null);d.folderIds.push(f.id);paintMenu();paintTags();renderContent();toast(`Added to <b>${esc(nm)}</b>`)}
    else if(k==='mtoggle'){const id=x.dataset.id;const i=d.folderIds.indexOf(id);if(i>-1)d.folderIds.splice(i,1);else d.folderIds.push(id);paintMenu();paintTags()}
    else if(k==='untag'){d.folderIds=d.folderIds.filter(f=>f!==x.dataset.id);paintTags();if(!menu.hidden)paintMenu()}
    else if(k==='viewdup'){const ex=S.items.get(x.dataset.id);closeSheet(w);if(ex)setTimeout(()=>openItem(ex.id),330)}
    else if(k==='copy'){try{await navigator.clipboard.writeText(d.url);toast('Link copied')}catch(err){toast('Couldn’t copy')}}
    else if(k==='sharelink'){if(navigator.share)navigator.share({url:d.url,title:dTitle(d)}).catch(()=>{});else{try{await navigator.clipboard.writeText(d.url);toast('Link copied')}catch(err){}}}
    else if(k==='sharefile'){if(!blob){toast('File not found');return}const f=new File([blob],d.fileName||'file',{type:d.mime||blob.type});
      if(navigator.canShare&&navigator.canShare({files:[f]}))navigator.share({files:[f]}).catch(()=>{});else downloadFile(f)}
    else if(k==='delete'){if(await confirmSheet('Delete this item?','It’ll be removed from every folder. This can’t be undone.')){await deleteItem(d.id);closeSheet(w);toast('Deleted')}}})}
async function deleteItem(id){await dbDel('items',id);await dbDel('blobs',id).catch(()=>{});S.items.delete(id);S.index.delete(id);const c=S.urls.get(id);if(c){URL.revokeObjectURL(c.u);S.urls.delete(id)}renderContent()}
function openItem(id){const it=S.items.get(id);if(!it)return;openEditor(Object.assign({},it,{folderIds:[...it.folderIds],preview:it.preview?Object.assign({},it.preview):null}),{})}
function downloadFile(f){const u=URL.createObjectURL(f);const a=document.createElement('a');a.href=u;a.download=f.name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000)}

/* ============ paste ============ */
const defaultFolders=()=>route().v==='folder'&&S.folders.has(route().id)?[route().id]:[];
async function doPaste(){let text='',img=null,denied=false;
  try{
    if(navigator.clipboard&&navigator.clipboard.read){const items=await navigator.clipboard.read();
      for(const ci of items){const it=ci.types.find(t=>/^image\//.test(t));
        if(ci.types.includes('text/plain')){text=await (await ci.getType('text/plain')).text()}
        else if(ci.types.includes('text/uri-list')){text=(await (await ci.getType('text/uri-list')).text()).split(/\r?\n/).find(l=>l&&l[0]!=='#')||''}
        if(it&&!isUrl(normUrl(text)))img=await ci.getType(it);
        if(text||img)break}}
    else if(navigator.clipboard&&navigator.clipboard.readText){text=await navigator.clipboard.readText()}
  }catch(e){denied=true}
  if(img){const ext=(img.type.split('/')[1]||'png').replace('jpeg','jpg');const f=new File([img],`Pasted image.${ext}`,{type:img.type});
    const d=await draftFromFile(f);d.folderIds=defaultFolders();openEditor(d,{isNew:true});return}
  text=(text||'').trim();
  if(!text)toast(denied?'Tap <b>Paste</b> in the bubble to allow':'Clipboard is empty — type or paste a link');
  openEditor({type:'link',url:text?normUrl(text):'',title:'',description:'',folderIds:defaultFolders()},{isNew:true})}

/* ============ upload ============ */
async function draftFromFile(f){const mime=f.type||'';const type=/^image\//.test(mime)?'image':/^video\//.test(mime)?'video':'file';
  const d={type,blob:f,fileName:f.name||'file',mime,size:f.size,title:'',description:'',folderIds:[]};
  if(type==='image')d.thumb=await shrink(f,480).catch(()=>null);
  if(type==='video'){const v=await videoInfo(f);d.thumb=v.thumb;d.duration=v.duration}
  return d}
$('#file-input').addEventListener('change',async e=>{const files=[...e.target.files];e.target.value='';if(!files.length)return;
  toast(files.length>1?`Preparing ${files.length} files…`:'Preparing…');const drafts=[];
  for(const f of files){const d=await draftFromFile(f);d.folderIds=defaultFolders();drafts.push(d)}
  openEditor(drafts[0],{isNew:true,queue:{drafts,index:0,total:drafts.length}})});

/* ============ settings, backup ============ */
function blobToDataURL(b){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=()=>rej(r.error);r.readAsDataURL(b)})}
async function buildBackup(){const parts=[`{"app":"pasty","version":1,"exportedAt":${Date.now()},"folders":${JSON.stringify([...S.folders.values()])},"items":[`];let first=true;
  for(const it of S.items.values()){const o=Object.assign({},it);delete o.thumb;
    o.thumbData=it.thumb?await blobToDataURL(it.thumb):null;
    if(it.type!=='link'){const b=await dbGet('blobs',it.id);o.blobData=b?await blobToDataURL(b):null}
    parts.push((first?'':',')+JSON.stringify(o));first=false}
  parts.push(']}');const d=new Date();
  return new File(parts,`pasty-backup-${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}.json`,{type:'application/json'})}
const fromDataURL=u=>fetch(u).then(r=>r.blob());
async function importBackup(file){let data;try{data=JSON.parse(await file.text())}catch(e){toast('That file isn’t a pasty backup');return}
  if(!data||data.app!=='pasty'){toast('That file isn’t a pasty backup');return}
  let nf=0,ni=0;
  for(const f of data.folders||[])if(!S.folders.has(f.id)){await dbPut('folders',f);S.folders.set(f.id,f);nf++}
  for(const o of data.items||[]){if(S.items.has(o.id))continue;const it=Object.assign({},o);delete it.thumbData;delete it.blobData;
    it.thumb=o.thumbData?await fromDataURL(o.thumbData):null;it.folderIds=it.folderIds||[];
    if(o.blobData)await dbPut('blobs',await fromDataURL(o.blobData),it.id);
    await dbPut('items',it);S.items.set(it.id,it);ni++}
  reindexAll();render();toast(`Imported <b>${ni}</b> items, <b>${nf}</b> folders`)}
$('#import-input').addEventListener('change',e=>{const f=e.target.files[0];e.target.value='';if(f)importBackup(f)});
async function openSettings(){let used='—';try{const e=await navigator.storage.estimate();used=fmtSize(e.usage||0)||'0 B'}catch(e){}
  const media=[...S.items.values()].filter(i=>i.type!=='link').length;
  const w=openSheet(`<div class="sheet-head"><span style="min-width:64px"></span><div class="t">pasty</div><button class="hlink strong" data-x="done">Done</button></div>
   <div class="sheet-body">
    <div class="group">
     <div class="field"><div class="stat">Links<em>${S.items.size-media}</em></div></div>
     <div class="field"><div class="stat">Photos, videos &amp; files<em>${media}</em></div></div>
     <div class="field"><div class="stat">Folders<em>${S.folders.size}</em></div></div>
     <div class="field"><div class="stat">Space used on this iPhone<em>${esc(used)}</em></div></div>
    </div>
    <div class="label">Backup</div>
    <div class="exp"><button class="btn accent wide" data-x="export">${I(P.down)}Export backup</button></div>
    <button class="btn wide mt" data-x="import">${I(P.up)}Import backup</button>
    <div class="fine">Everything lives only on this iPhone. Export a backup now and then and save it to iCloud Drive or Files — importing it later adds back anything missing.</div>
    <div class="fine">Link previews are looked up through microlink.io when you paste a link. Nothing else ever leaves your phone.</div>
   </div>`);
  w.addEventListener('click',async e=>{const x=e.target.closest('[data-x]');if(!x)return;const k=x.dataset.x;
    if(k==='done')closeSheet(w);
    else if(k==='import'){$('#import-input').click()}
    else if(k==='export'){x.disabled=true;x.innerHTML='Preparing backup…';try{const file=await buildBackup();w._file=file;
        w.querySelector('.exp').innerHTML=`<button class="btn primary wide" data-x="savefile">${I(P.share)}Save backup (${esc(fmtSize(file.size))})</button>`}
      catch(err){x.disabled=false;x.innerHTML='Export backup';toast('Backup failed')}}
    else if(k==='savefile'){const f=w._file;if(navigator.canShare&&navigator.canShare({files:[f]}))navigator.share({files:[f]}).catch(()=>{});else downloadFile(f)}})}

/* ============ global taps ============ */
document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el||el.closest('.sheet-wrap'))return;const a=el.dataset.act;
  if(a==='paste')doPaste();
  else if(a==='upload')$('#file-input').click();
  else if(a==='new-folder')openFolderSheet(null,route().v==='folder'?route().id:'');
  else if(a==='open-item')openItem(el.dataset.id);
  else if(a==='goto-folder'){e.stopPropagation();const r=route();if(!(r.v==='folder'&&r.id===el.dataset.id))go({v:'folder',id:el.dataset.id})}
  else if(a==='go')go({v:el.dataset.v});
  else if(a==='back')back();
  else if(a==='folder-menu'){const f=S.folders.get(el.dataset.id);if(f)openFolderSheet(f)}
  else if(a==='settings')openSettings();
  else if(a==='clear-search'){const q=$('#q');q.value='';route().q='';q.parentNode.classList.remove('has');renderContent();q.focus()}});
/* swipe from left edge = back */
let ex0=null;document.addEventListener('touchstart',e=>{const t=e.touches[0];ex0=(t.clientX<24&&S.stack.length>1&&!$('#sheets').children.length)?{x:t.clientX,y:t.clientY}:null},{passive:true});
document.addEventListener('touchend',e=>{if(!ex0)return;const t=e.changedTouches[0];if(t.clientX-ex0.x>80&&Math.abs(t.clientY-ex0.y)<60)back();ex0=null},{passive:true});

/* ============ start ============ */
(async()=>{
  try{await openDB()}catch(e){$('#view').innerHTML='<div class="hero"><h1>pasty<b>.</b></h1></div>'+emptyHTML(P.x,'Storage unavailable','Open pasty from your Home Screen (not a private Safari tab).');return}
  const [fs,is]=await Promise.all([dbAll('folders'),dbAll('items')]);
  fs.forEach(f=>S.folders.set(f.id,f));is.forEach(i=>{i.folderIds=i.folderIds||[];S.items.set(i.id,i)});
  reindexAll();render();
  try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
  if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('./sw.js').catch(()=>{});
})();
</script>
</body>
</html>
